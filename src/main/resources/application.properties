# ===================================================================
# Database Configuration (MySQL)
# ===================================================================

# Database URL: Connects to MySQL on localhost port 3306.
# 'createDatabaseIfNotExist=true' automatically creates the database 'careerpath_db' if it doesn't exist.
spring.datasource.url=jdbc:mysql://localhost:3306/careerpath_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false

# Database Username: The default MySQL username is 'root'
spring.datasource.username=root

# Database Password: CHANGE THIS to your MySQL root password.
# If you don't have a password set, leave it empty.
spring.datasource.password=${DB_PASSWORD}

# Driver Class Name
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================

# ddl-auto=update: Spring Boot automatically creates/updates database tables based on our Java classes.
spring.jpa.hibernate.ddl-auto=update

# show-sql=true: Prints all SQL statements to the console so you can see database queries in real-time.
spring.jpa.show-sql=true

# ===================================================================
# SQL Script Initialization Configuration
# ===================================================================

# init.mode=always: Tells Spring Boot to always run 'schema.sql' and 'data.sql' when starting.
spring.sql.init.mode=always

# Allow overwriting existing data during startup initialization
spring.sql.init.continue-on-error=true

gemini.api.key=${GCP_API_KEY}